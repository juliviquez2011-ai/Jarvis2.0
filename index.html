<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. OS - Stark Edition</title>
    <!-- Three.js para la esfera holográfica y el visor CAD 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; background-color: #020813; color: #00f0ff; overflow: hidden; }

        /* Contenedor principal HUD */
        #hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        /* Canvas de fondo (Esfera Holográfica Saturno) */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .interactive {
            pointer-events: auto;
            z-index: 10;
        }

        /* Esquina Superior Derecha: Slot y Lector 3D */
        #top-right-slot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            height: 260px;
            border: 2px dashed rgba(0, 240, 255, 0.5);
            background: rgba(2, 8, 19, 0.9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        #top-right-slot.drag-over {
            border-color: #00ff66;
            background: rgba(0, 255, 102, 0.15);
        }
        #viewer-3d {
            width: 100%;
            height: 140px;
            background: #000;
            border-radius: 6px;
            position: relative;
        }
        /* Consola de Código CAD Interna */
        #cad-code-display {
            width: 100%;
            height: 75px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            margin-top: 6px;
            padding: 5px;
            font-size: 10px;
            color: #00ff66;
            overflow: hidden;
            white-space: pre-wrap;
        }
        .slot-title {
            font-size: 11px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            color: #00f0ff;
        }

        /* Panel de Chat Lateral */
        #jarvis-chat {
            position: absolute;
            top: 100px;
            left: 30px;
            width: 400px;
            max-height: 45vh;
            overflow-y: auto;
            background: rgba(2, 8, 19, 0.85);
            border-left: 3px solid #00f0ff;
            padding: 15px;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
            backdrop-filter: blur(5px);
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.jarvis { color: #00f0ff; }
        .msg.user { color: #ffffff; text-align: right; }

        /* Barra Inferior Interactiva */
        #bottom-bar {
            position: absolute;
            bottom: 25px;
            width: 90%;
            max-width: 700px;
            background: rgba(2, 8, 19, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            z-index: 9999;
            pointer-events: auto;
        }

        #bottom-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 0 10px;
            pointer-events: auto;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 13px;
            transition: 0.2s;
            pointer-events: auto;
        }
        .hud-btn:hover, .hud-btn.active {
            background: #00f0ff;
            color: #020813;
            box-shadow: 0 0 10px #00f0ff;
        }

        #camera-input { display: none; }
    </style>
</head>
<body>

    <!-- Canvas de la Esfera Holográfica (Saturno) -->
    <canvas id="bg-canvas"></canvas>

    <div id="hud-container">
        
        <!-- Mensajes del sistema -->
        <div id="jarvis-chat" class="interactive">
            <div class="msg jarvis">JARVIS: Sistemas en línea. Núcleo holográfico activo.</div>
        </div>

        <!-- Slot Superior Derecho: Visor CAD / Código 3D -->
        <div id="top-right-slot" class="interactive" ondragover="allowDrop(event)" ondragleave="removeDropEffect(event)" ondrop="dropCode(event)">
            <div class="slot-title">SLOT 3D & COMPILADOR CAD</div>
            <div id="viewer-3d"></div>
            <div id="cad-code-display">// Sistema CAD en espera...\n> Listo para compilar geometrías.</div>
        </div>

        <!-- Barra Inferior de Control -->
        <div id="bottom-bar">
            <button class="hud-btn" onclick="triggerCamera()" title="Capturar Cámara">📷 +</button>
            <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleImage(event)">
            
            <input type="text" id="user-input" placeholder="Comando para JARVIS o di 'Jarvis'..." onkeypress="checkEnter(event)">
            
            <button id="mic-btn" class="hud-btn" onclick="toggleVoiceLoop()" title="Activar Escucha Continua">🎙️ Escucha</button>
            <button class="hud-btn" onclick="sendPrompt()">Enviar</button>
        </div>

    </div>

    <script>
        // --- 1. MOTOR DE LA ESFERA HOLOGRÁFICA ---
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const sphereGeo = new THREE.SphereGeometry(1.8, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.3 });
        const coreSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(coreSphere);

        const ringGeo1 = new THREE.RingGeometry(2.5, 3.2, 64);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.5, wireframe: true });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 2;
        scene.add(ring1);

        const ringGeo2 = new THREE.RingGeometry(3.5, 3.8, 64);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.3, wireframe: true });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.x = Math.PI / 2.2;
        ring2.rotation.y = Math.PI / 6;
        scene.add(ring2);

        camera.position.z = 7;

        function animateHolo() {
            requestAnimationFrame(animateHolo);
            coreSphere.rotation.y += 0.005;
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            renderer.render(scene, camera);
        }
        animateHolo();

        // --- 2. VISOR 3D SUPERIOR DERECHO (GEOMETRÍA Y GRUPO DINÁMICO) ---
        const viewerContainer = document.getElementById('viewer-3d');
        const scene3D = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(75, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
        const renderer3D = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer3D.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        viewerContainer.appendChild(renderer3D.domElement);

        let activeMeshGroup = new THREE.Group();
        scene3D.add(activeMeshGroup);
        camera3D.position.z = 3.5;

        function updateVisorModel(type) {
            // Limpiar grupo anterior
            while(activeMeshGroup.children.length > 0){ 
                activeMeshGroup.remove(activeMeshGroup.children[0]); 
            }

            if (type === 'armor') {
                // Simulación de Ensamblaje de Traje / Armadura con múltiples piezas (Placas Mark)
                const matGold = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                const matRed = new THREE.MeshBasicMaterial({ color: 0xff0033, wireframe: true });

                const chestBox = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.2, 0.6), matRed);
                chestBox.position.set(0, 0, 0);

                const helmetBox = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5), matGold);
                helmetBox.position.set(0, 1.0, 0);

                const shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matGold);
                shoulderL.position.set(-0.7, 0.5, 0);

                const shoulderR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matGold);
                shoulderR.position.set(0.7, 0.5, 0);

                activeMeshGroup.add(chestBox);
                activeMeshGroup.add(helmetBox);
                activeMeshGroup.add(shoulderL);
                activeMeshGroup.add(shoulderR);

            } else {
                let geom, mat;
                if (type === 'sphere') {
                    geom = new THREE.SphereGeometry(1.0, 16, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
                } else if (type === 'cylinder') {
                    geom = new THREE.CylinderGeometry(0.8, 0.8, 1.5, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                } else if (type === 'torus') {
                    geom = new THREE.TorusGeometry(0.9, 0.3, 16, 32);
                    mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
                } else {
                    geom = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
                }
                const singleMesh = new THREE.Mesh(geom, mat);
                activeMeshGroup.add(singleMesh);
            }
        }

        // Inicializar con cubo predeterminado
        updateVisorModel('box');

        function animateSlot3D() {
            requestAnimationFrame(animateSlot3D);
            if (activeMeshGroup) {
                activeMeshGroup.rotation.x += 0.008;
                activeMeshGroup.rotation.y += 0.012;
            }
            renderer3D.render(scene3D, camera3D);
        }
        animateSlot3D();

        // --- 3. LÓGICA DE INTERACCIÓN Y CÓDIGO CAD ---
        function triggerCamera() {
            document.getElementById('camera-input').click();
        }

        function handleImage(event) {
            const file = event.target.files[0];
            if (file) {
                addChatMessage("Imagen capturada y enviada al núcleo. Analizando geometría...", "user");
                speakJarvis("A la orden, señor. Analizando estructura visual.");
                setTimeout(() => {
                    addChatMessage("JARVIS: Geometría de hardware analizada con éxito.", "jarvis");
                }, 1000);
            }
        }

        function sendPrompt() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addChatMessage(text, "user");
            input.value = "";

            processJarvisCommand(text);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendPrompt();
        }

        function addChatMessage(text, sender, isHtml = false) {
            const chat = document.getElementById('jarvis-chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            if (isHtml) {
                div.innerHTML = text;
            } else {
                div.innerText = text;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function updateCadCode(codeText) {
            const codeBox = document.getElementById('cad-code-display');
            codeBox.innerText = codeText;
        }

        function allowDrop(ev) { ev.preventDefault(); document.getElementById('top-right-slot').classList.add('drag-over'); }
        function removeDropEffect(ev) { document.getElementById('top-right-slot').classList.remove('drag-over'); }
        function dropCode(ev) {
            ev.preventDefault();
            removeDropEffect(ev);
            addChatMessage("JARVIS: Código recibido en el slot CAD. Compilando modelo...", "jarvis");
            speakJarvis("A la orden, señor. Compilando modelo en el visor.");
            updateVisorModel('box');
            updateCadCode("// Archivo Externo Compilado\nMesh.loadBox(1.2);\nStatus: OK");
        }

        // --- 4. SÍNTESIS DE VOZ SINCRONIZADA ---
        function speakJarvis(text, onFinished = null) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/["'«»]/g, '');
                const speech = new SpeechSynthesisUtterance(cleanText);
                
                speech.lang = 'es-ES';
                speech.rate = 1.0;
                speech.pitch = 1.0; 

                let voices = window.speechSynthesis.getVoices();
                let selectedVoice = voices.find(v => v.lang.startsWith('es') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('pablo'))) || voices.find(v => v.lang.startsWith('es'));

                if (selectedVoice) {
                    speech.voice = selectedVoice;
                }

                if (onFinished) {
                    speech.onend = onFinished;
                }

                window.speechSynthesis.speak(speech);
            } else if (onFinished) {
                onFinished();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // --- 5. RECONOCIMIENTO DE VOZ Y WAKE WORD ---
        let recognition = null;
        let isListeningActive = false;

        function toggleVoiceLoop() {
            const btn = document.getElementById('mic-btn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Tu navegador no soporta reconocimiento de voz nativo.");
                return;
            }

            if (isListeningActive) {
                if (recognition) recognition.stop();
                isListeningActive = false;
                btn.classList.remove('active');
                addChatMessage("JARVIS: Escucha continua pausada.", "jarvis");
            } else {
                startContinuousListening();
                isListeningActive = true;
                btn.classList.add('active');
                addChatMessage("JARVIS: Escucha continua activa. Di 'Jarvis' seguido de tu orden...", "jarvis");
                speakJarvis("A la orden, señor. Sistemas de escucha activos.");
            }
        }

        function startContinuousListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("Audio capturado:", transcript);

                if (transcript.toLowerCase().includes("jarvis")) {
                    addChatMessage(transcript, "user");
                    processJarvisCommand(transcript);
                }
            };

            recognition.onerror = function(event) {
                console.log("Error de reconocimiento de voz: ", event.error);
            };

            recognition.onend = function() {
                if (isListeningActive) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            try { recognition.start(); } catch(e) {}
        }

        // --- 6. PROCESADOR INTELIGENTE CON PROTOCOLO DE ARMADURA Y MODELOS ---
        async function processJarvisCommand(command) {
            const lower = command.toLowerCase();
            const isJarvisCalled = lower.includes("jarvis");

            let speechText = "";
            if (isJarvisCalled) {
                speechText += "A la orden, señor. ";
            }

            // CASO A: PROTOCOLO DE TRAJE / ARMADURA
            if (lower.includes("traje") || lower.includes("armadura") || lower.includes("mark")) {
                updateVisorModel('armor');
                updateCadCode("// PROTOCOLO DE ARMADURA STARK\nAssembly.loadArmorMatrix();\nServos: Calibrados [OK]");

                addChatMessage("JARVIS: Iniciando protocolo de despliegue de armadura en visor CAD.", "jarvis");
                speakJarvis(speechText + "Iniciando protocolo de ensamblaje de armadura, señor.");
            }
            // CASO B: DISEÑAR / CREAR / MODELAR OTRAS FIGURAS
            else if (lower.includes("diseña") || lower.includes("crea") || lower.includes("modelo")) {
                let shapeType = 'box';
                let shapeName = 'cubo';
                let codeSnippet = '// Estructura Rectangular\nGeometry.createBox(1.2);\nMatrix.applyTransform();';

                if (lower.includes("esfera") || lower.includes("bola") || lower.includes("circulo")) {
                    shapeType = 'sphere';
                    shapeName = 'esfera';
                    codeSnippet = '// Núcleo Esférico Radial\nGeometry.createSphere(1.0);\nShader.applyWireframe();';
                } else if (lower.includes("cilindro") || lower.includes("tubo")) {
                    shapeType = 'cylinder';
                    shapeName = 'cilindro';
                    codeSnippet = '// Componente Cilíndrico\nGeometry.createCylinder(0.8, 1.5);\nAxis.alignZ();';
                } else if (lower.includes("anillo") || lower.includes("aro") || lower.includes("toro")) {
                    shapeType = 'torus';
                    shapeName = 'anillo toroidal';
                    codeSnippet = '// Estructura Toroidal\nGeometry.createTorus(0.9, 0.3);\nRotation.setAngle(45);';
                }

                updateVisorModel(shapeType);
                updateCadCode(codeSnippet);

                addChatMessage(`JARVIS: Generando modelo de ${shapeName} en visor CAD.`, "jarvis");
                speakJarvis(speechText + `Generando diseño de ${shapeName} en el visor.`);
            } 
            // CASO C: SALUDOS
            else if (lower.includes("hola") || lower.includes("saludos") || lower.includes("buenos días")) {
                addChatMessage("JARVIS: Sistemas operativos funcionando de manera óptima, señor.", "jarvis");
                speakJarvis(speechText + "Sistemas operativos en línea, señor.");
            }
            // CASO D: AGRADECIMIENTOS
            else if (lower.includes("gracias") || lower.includes("muchas gracias")) {
                addChatMessage("JARVIS: A su servicio, señor.", "jarvis");
                speakJarvis(speechText + "A su servicio, señor. Para eso estamos.");
            }
            // CASO E: BÚSQUEDA / INVESTIGACIÓN
            else if (lower.includes("investiga") || lower.includes("busca") || lower.includes("qué es") || lower.includes("como es")) {
                let queryClean = command
                    .replace(/jarvis/gi, "")
                    .replace(/investiga profundamente sobre/gi, "")
                    .replace(/investiga sobre/gi, "")
                    .replace(/investiga el/gi, "")
                    .replace(/investiga la/gi, "")
                    .replace(/investiga/gi, "")
                    .replace(/busca sobre/gi, "")
                    .replace(/busca el/gi, "")
                    .replace(/busca la/gi, "")
                    .replace(/busca/gi, "")
                    .replace(/qué es/gi, "")
                    .replace(/cómo es/gi, "")
                    .trim();

                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(queryClean)}`;
                
                addChatMessage(`JARVIS: Investigando en red: "${queryClean}".`, "jarvis");
                
                const spokenMessage = speechText + `Investigando sobre ${queryClean}.`;
                speakJarvis(spokenMessage, () => {
                    window.location.href = searchUrl;
                });
            }
            // CASO F: OTROS
            else {
                addChatMessage("JARVIS: Comando recibido, señor. Usa 'diseña traje' o 'investiga'.", "jarvis");
                speakJarvis(speechText + "Comando recibido, señor.");
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
