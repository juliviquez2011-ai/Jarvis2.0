<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. OS - Dual Neural Core (Gemini / Groq)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; background-color: #020813; color: var(--theme-color, #00f0ff); overflow: hidden; transition: background 0.5s ease; }

        :root {
            --theme-color: #00f0ff;
            --theme-glow: rgba(0, 240, 255, 0.4);
            --theme-bg: rgba(2, 8, 19, 0.95);
        }

        #hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .interactive {
            pointer-events: auto;
            z-index: 10;
        }

        #api-config-panel {
            position: absolute;
            top: 20px;
            left: 30px;
            background: var(--theme-bg);
            border: 1px solid var(--theme-glow);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .api-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #api-config-panel input {
            background: #000;
            border: 1px solid var(--theme-color);
            color: #00ff66;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            width: 140px;
            outline: none;
        }

        #settings-toggle-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10000;
        }

        #settings-modal {
            position: absolute;
            bottom: 80px;
            right: 25px;
            width: 320px;
            background: var(--theme-bg);
            border: 1px solid var(--theme-color);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px var(--theme-glow);
            z-index: 20000;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        #settings-modal h3 {
            font-size: 13px;
            border-bottom: 1px solid var(--theme-glow);
            padding-bottom: 5px;
            letter-spacing: 1px;
            color: var(--theme-color);
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
        }
        .setting-group label {
            color: var(--theme-color);
        }
        .setting-group select {
            background: #000;
            border: 1px solid var(--theme-color);
            color: #00ff66;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            outline: none;
        }

        #top-right-slot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            height: 260px;
            border: 2px dashed var(--theme-glow);
            background: var(--theme-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            backdrop-filter: blur(10px);
        }
        #viewer-3d {
            width: 100%;
            height: 140px;
            background: #000;
            border-radius: 6px;
            position: relative;
        }
        #cad-code-display {
            width: 100%;
            height: 75px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid var(--theme-glow);
            border-radius: 4px;
            margin-top: 6px;
            padding: 5px;
            font-size: 10px;
            color: #00ff66;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .slot-title {
            font-size: 11px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            color: var(--theme-color);
        }

        #jarvis-chat {
            position: absolute;
            top: 170px;
            left: 30px;
            width: 400px;
            max-height: 42vh;
            overflow-y: auto;
            background: rgba(2, 8, 19, 0.85);
            border-left: 3px solid var(--theme-color);
            padding: 15px;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
            backdrop-filter: blur(5px);
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.jarvis { color: var(--theme-color); }
        .msg.user { color: #ffffff; text-align: right; }
        .model-link-btn {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 8px;
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid var(--theme-color);
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-size: 11px;
        }
        .model-link-btn:hover { background: var(--theme-color); color: #000; }

        #bottom-watermark {
            position: absolute;
            bottom: 30px;
            left: 68%;
            transform: translateX(-50%);
            font-size: 18px;
            letter-spacing: 4px;
            color: #00ffaa;
            text-shadow: 0 0 12px rgba(0, 255, 170, 0.7);
            z-index: 5;
            pointer-events: none;
            font-weight: bold;
        }

        #bottom-bar {
            position: absolute;
            bottom: 25px;
            width: calc(90% - 70px);
            max-width: 620px;
            left: 30px;
            background: var(--theme-bg);
            border: 1px solid var(--theme-glow);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px var(--theme-glow);
            z-index: 9999;
            pointer-events: auto;
        }

        #bottom-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 0 10px;
            pointer-events: auto;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid var(--theme-color);
            color: var(--theme-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 13px;
            transition: 0.2s;
            pointer-events: auto;
        }
        .hud-btn:hover {
            background: var(--theme-color);
            color: #020813;
            box-shadow: 0 0 10px var(--theme-color);
        }

        #mic-btn.listening {
            background: #ff3333;
            border-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 15px #ff3333;
            animation: pulse-mic 1s infinite;
        }

        @keyframes pulse-mic {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="hud-container">
        
        <div id="api-config-panel" class="interactive">
            <div class="api-row">
                <span style="width: 55px;">Gemini:</span>
                <input type="password" id="gemini-key-input" placeholder="AIzaSy..." onchange="saveKeys()">
            </div>
            <div class="api-row">
                <span style="width: 55px;">Groq:</span>
                <input type="password" id="groq-key-input" placeholder="gsk_..." onchange="saveKeys()">
            </div>
            <button class="hud-btn" style="padding: 2px 8px; font-size: 10px; margin-left: 0; margin-top: 2px;" onclick="saveKeys()">Guardar Llaves</button>
        </div>

        <button id="settings-toggle-btn" class="hud-btn interactive" style="padding: 8px 12px; font-size: 13px;" onclick="toggleSettingsMenu()">⚙️ Config</button>

        <div id="settings-modal" class="interactive">
            <h3>PANEL DE CONFIGURACIÓN J.A.R.V.I.S.</h3>
            
            <div class="setting-group">
                <label>Voz del Sistema (Hombre / Español):</label>
                <select id="voice-select" onchange="updateSelectedVoice(this.value)">
                    <option value="">Cargando voces...</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Velocidad de Voz:</label>
                <select id="voice-rate-select" onchange="updateVoiceRate(this.value)">
                    <option value="0.9">Normal (0.9x)</option>
                    <option value="1.0">Rápida (1.0x)</option>
                    <option value="0.8">Lenta (0.8x)</option>
                </select>
            </div>

            <div style="display: flex; gap: 6px; margin-top: 5px;">
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px;" onclick="clearChatHistory()">Limpiar Chat</button>
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px; border-color: #00ff88; color: #00ff88;" onclick="restartSystem()">🔄 Reiniciar</button>
            </div>

            <button class="hud-btn" style="margin-left: 0; margin-top: 2px; text-align: center; font-size: 11px;" onclick="toggleSettingsMenu()">Cerrar Panel</button>
        </div>

        <div id="jarvis-chat" class="interactive">
            <div class="msg jarvis" id="welcome-msg">JARVIS: Núcleo neural dual activo, señor.</div>
        </div>

        <div id="top-right-slot" class="interactive">
            <div class="slot-title">SLOT 3D & BUSCADOR CAD</div>
            <div id="viewer-3d"></div>
            <div id="cad-code-display">// Sistema de Red Listos...\n> Pida un modelo para buscar enlaces en internet, señor.</div>
        </div>

        <div id="bottom-watermark">J.A.R.V.I.S.</div>

        <div id="bottom-bar">
            <input type="text" id="user-input" placeholder="Indique su orden a JARVIS, señor..." onkeypress="checkEnter(event)">
            <button id="mic-btn" class="hud-btn" onclick="toggleSpeechRecognition()" title="Activar escucha de voz">🎙️</button>
            <button class="hud-btn" onclick="sendPrompt()">Enviar</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const sphereGeo = new THREE.SphereGeometry(1.8, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.3 });
        const coreSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(coreSphere);

        const ringGeo1 = new THREE.RingGeometry(2.3, 2.7, 64);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.6, wireframe: true });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 2;
        scene.add(ring1);

        const ringGeo2 = new THREE.RingGeometry(3.0, 3.4, 64);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.4, wireframe: true });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.x = Math.PI / 2.2;
        ring2.rotation.y = Math.PI / 6;
        scene.add(ring2);

        const ringGeo3 = new THREE.RingGeometry(3.8, 4.1, 64);
        const ringMat3 = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.3, wireframe: true });
        const ring3 = new THREE.Mesh(ringGeo3, ringMat3);
        ring3.rotation.x = Math.PI / 1.5;
        ring3.rotation.z = Math.PI / 4;
        scene.add(ring3);

        camera.position.z = 7;

        let clock = new THREE.Clock();
        let isStarkMode = false;

        function animateHolo() {
            requestAnimationFrame(animateHolo);
            let elapsedTime = clock.getElapsedTime();

            coreSphere.rotation.y += 0.005;
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            ring3.rotation.x += 0.005;
            ring3.rotation.y -= 0.007;

            if (!isStarkMode) {
                let dynamicHue = (elapsedTime * 0.05) % 1;
                ringMat1.color.setHSL(dynamicHue, 1.0, 0.5);
                ringMat2.color.setHSL((dynamicHue + 0.3) % 1, 1.0, 0.5);
                ringMat3.color.setHSL((dynamicHue + 0.6) % 1, 1.0, 0.5);
            }

            renderer.render(scene, camera);
        }
        animateHolo();

        const viewerContainer = document.getElementById('viewer-3d');
        const scene3D = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(60, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
        const renderer3D = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer3D.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        viewerContainer.appendChild(renderer3D.domElement);

        let activeMeshGroup = new THREE.Group();
        scene3D.add(activeMeshGroup);
        camera3D.position.z = 3.2;

        function setStarkTheme(active) {
            isStarkMode = active;
            const root = document.documentElement;
            if (active) {
                root.style.setProperty('--theme-color', '#ff3333');
                root.style.setProperty('--theme-glow', 'rgba(255, 170, 0, 0.5)');
                root.style.setProperty('--theme-bg', 'rgba(20, 2, 2, 0.95)');
                
                coreSphere.material.color.setHex(0xff3333);
                ringMat1.color.setHex(0xffaa00);
                ringMat2.color.setHex(0xff3333);
                ringMat3.color.setHex(0xffaa00);
            } else {
                root.style.setProperty('--theme-color', '#00f0ff');
                root.style.setProperty('--theme-glow', 'rgba(0, 240, 255, 0.4)');
                root.style.setProperty('--theme-bg', 'rgba(2, 8, 19, 0.95)');
                coreSphere.material.color.setHex(0x00f0ff);
            }
        }

        function updateVisorModel(type) {
            while(activeMeshGroup.children.length > 0){ 
                const obj = activeMeshGroup.children[0];
                activeMeshGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }

            if (type === 'armor') {
                setStarkTheme(true);
                const matGold = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                const matRed = new THREE.MeshBasicMaterial({ color: 0xff0033, wireframe: true });
                const chestBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), matRed);
                chestBox.position.set(0, 0, 0);
                const helmetBox = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), matGold);
                helmetBox.position.set(0, 0.85, 0);
                const shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matGold);
                shoulderL.position.set(-0.6, 0.4, 0);
                const shoulderR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matGold);
                shoulderR.position.set(0.6, 0.4, 0);

                activeMeshGroup.add(chestBox);
                activeMeshGroup.add(helmetBox);
                activeMeshGroup.add(shoulderL);
                activeMeshGroup.add(shoulderR);
            } else {
                setStarkTheme(false);
                let geom, mat;
                if (type === 'sphere') {
                    geom = new THREE.SphereGeometry(0.9, 16, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
                } else if (type === 'cylinder') {
                    geom = new THREE.CylinderGeometry(0.6, 0.6, 1.3, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                } else if (type === 'torus') {
                    geom = new THREE.TorusGeometry(0.7, 0.25, 16, 32);
                    mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
                } else if (type === 'cone') {
                    geom = new THREE.ConeGeometry(0.8, 1.4, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true });
                } else if (type === 'pyramid') {
                    geom = new THREE.ConeGeometry(0.9, 1.3, 4);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });
                } else {
                    geom = new THREE.BoxGeometry(1.0, 1.0, 1.0);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
                }
                const singleMesh = new THREE.Mesh(geom, mat);
                activeMeshGroup.add(singleMesh);
            }
        }

        updateVisorModel('box');

        function animateSlot3D() {
            requestAnimationFrame(animateSlot3D);
            if (activeMeshGroup) {
                activeMeshGroup.rotation.x += 0.01;
                activeMeshGroup.rotation.y += 0.015;
            }
            renderer3D.render(scene3D, camera3D);
        }
        animateSlot3D();

        let selectedVoiceIndex = 0;
        let voiceRateVal = 0.9;
        let voicesList = [];

        function getSystemPrompt() {
            return "Eres J.A.R.V.I.S., el mayordomo virtual y asistente de inteligencia artificial de Tony Stark. Te diriges al usuario estrictamente, en cada respuesta y sin excepciones, como 'señor'. Eres educado, sumamente inteligente, leal, sofisticado y formal.";
        }

        let chatHistory = [
            { role: "system", content: getSystemPrompt() }
        ];

        function toggleSettingsMenu() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            voicesList = window.speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().includes('es'));
            const select = document.getElementById('voice-select');
            select.innerHTML = '';
            
            if (voicesList.length === 0) {
                let opt = document.createElement('option');
                opt.text = "No hay voces en español detectadas";
                select.appendChild(opt);
                return;
            }

            // Ordenar priorizando nombres masculinos típicos en dispositivos Apple/Android
            voicesList.sort((a, b) => {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();
                const isMaleA = nameA.includes('pablo') || nameA.includes('alvaro') || nameA.includes('jorge') || nameA.includes('carlos') || nameA.includes('diego') || nameA.includes('males') || nameA.includes('david');
                const isMaleB = nameB.includes('pablo') || nameB.includes('alvaro') || nameB.includes('jorge') || nameB.includes('carlos') || nameB.includes('diego') || nameB.includes('males') || nameB.includes('david');
                return (isMaleB ? 1 : 0) - (isMaleA ? 1 : 0);
            });

            voicesList.forEach((voice, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                let tag = voice.name.toLowerCase();
                let genderHint = (tag.includes('pablo') || tag.includes('alvaro') || tag.includes('jorge') || tag.includes('carlos') || tag.includes('diego') || tag.includes('david')) ? ' [Voz Hombre]' : '';
                opt.text = `${voice.name} (${voice.lang})${genderHint}`;
                select.appendChild(opt);
            });

            // Seleccionar automáticamente la primera masculina si existe
            selectedVoiceIndex = 0;
        }

        function updateSelectedVoice(index) { selectedVoiceIndex = parseInt(index); }
        function updateVoiceRate(val) { voiceRateVal = parseFloat(val); }

        function clearChatHistory() {
            const chat = document.getElementById('jarvis-chat');
            chat.innerHTML = `<div class="msg jarvis" id="welcome-msg">JARVIS: Memoria de chat depurada, señor.</div>`;
            chatHistory = [{ role: "system", content: getSystemPrompt() }];
        }

        function restartSystem() { location.reload(); }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            setTimeout(loadVoices, 300);
        }

        function saveKeys() {
            const gKey = document.getElementById('gemini-key-input').value.trim();
            const groqKey = document.getElementById('groq-key-input').value.trim();
            if (gKey) localStorage.setItem('gemini_api_key', gKey);
            if (groqKey) localStorage.setItem('groq_api_key', groqKey);
            addChatMessage("JARVIS: Credenciales de IA guardadas en memoria, señor.", "jarvis");
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedGKey = localStorage.getItem('gemini_api_key');
            const savedGroqKey = localStorage.getItem('groq_api_key');
            if (savedGKey) document.getElementById('gemini-key-input').value = savedGKey;
            if (savedGroqKey) document.getElementById('groq-key-input').value = savedGroqKey;
        });

        // Configuración de Reconocimiento de Voz
        let recognition = null;
        let isListening = false;
        let shouldKeepListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('listening');
                document.getElementById('user-input').placeholder = "Escuchando... diga 'Jarvis' + su orden, señor.";
            };

            recognition.onresult = (event) => {
                let speechToText = event.results[event.results.length - 1][0].transcript.trim();
                const lowerText = speechToText.toLowerCase();
                
                if (lowerText.includes("jarvis")) {
                    let cleanOrder = speechToText.replace(/jarvis/gi, "").trim();
                    cleanOrder = cleanOrder.replace(/arduos/gi, "Arduinos");
                    cleanOrder = cleanOrder.replace(/arduinis/gi, "Arduinos");

                    if (cleanOrder.length > 0) {
                        document.getElementById('user-input').value = cleanOrder;
                        sendPrompt();
                    } else {
                        speakJarvis("A su servicio, señor.");
                    }
                }
            };

            recognition.onend = () => {
                if (shouldKeepListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    stopListeningState();
                }
            };
        }

        function stopListeningState() {
            shouldKeepListening = false;
            isListening = false;
            const micBtn = document.getElementById('mic-btn');
            if (micBtn) micBtn.classList.remove('listening');
            const input = document.getElementById('user-input');
            if (input) input.placeholder = "Indique su orden a JARVIS, señor...";
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("Su navegador no soporta reconocimiento de voz nativo, señor.");
                return;
            }
            if (isListening) {
                shouldKeepListening = false;
                recognition.stop();
                stopListeningState();
            } else {
                shouldKeepListening = true;
                try { recognition.start(); } catch(e) { recognition.stop(); }
            }
        }

        // Sistema Dual de Inteligencia Artificial (Gemini 3.5 con respaldo en Groq)
        async function queryAI(userText) {
            const geminiKey = localStorage.getItem('gemini_api_key') || document.getElementById('gemini-key-input').value.trim();
            const groqKey = localStorage.getItem('groq_api_key') || document.getElementById('groq-key-input').value.trim();

            chatHistory.push({ role: "user", content: userText });

            // 1. Intentar primero con Gemini (Gemini 2.5/3.5 Flash o Pro endpoint actual)
            if (geminiKey) {
                try {
                    // Mapeo adaptado para el formato de historial de Gemini API
                    const contents = chatHistory.filter(m => m.role !== 'system').map(m => ({
                        role: m.role === 'assistant' ? 'model' : 'user',
                        parts: [{ text: m.content }]
                    }));

                    const geminiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            system_instruction: { parts: [{ text: getSystemPrompt() }] },
                            contents: contents
                        })
                    });

                    const data = await geminiResponse.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        const reply = data.candidates[0].content.parts[0].text;
                        chatHistory.push({ role: "assistant", content: reply });
                        return reply;
                    }
                } catch (err) {
                    console.warn("Gemini agotado o con error, saltando a Groq...", err);
                }
            }

            // 2. Respaldo Automático con Groq si Gemini falla o no tiene llave
            if (groqKey) {
                try {
                    chatHistory[0].content = getSystemPrompt();
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${groqKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-20b",
                            messages: chatHistory,
                            max_tokens: 300,
                            temperature: 0.7
                        })
                    });

                    const data = await response.json();
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        const reply = data.choices[0].message.content;
                        chatHistory.push({ role: "assistant", content: reply });
                        return "[Vía Groq] " + reply;
                    }
                } catch (err) {
                    console.error("Error en Groq:", err);
                }
            }

            return "Por favor, configure su llave de Gemini o Groq en el panel superior izquierdo para habilitar mis sistemas cognitivos, señor.";
        }

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addChatMessage(text, "user");
            input.value = "";

            const lower = text.toLowerCase();
            let codeSnippet = '';

            // Detección de Modelos 3D y Búsqueda en Internet
            if (lower.includes("busca") || lower.includes("modelo") || lower.includes("stl") || lower.includes("imprimir")) {
                let searchTerm = encodeURIComponent(text.replace(/jarvis|busca|el modelo|de|para|imprimir/gi, "").trim());
                codeSnippet = `// BÚSQUEDA CAD EN RED\nQuery: "${decodeURIComponent(searchTerm)}"\nStatus: [ENLACES GENERADOS]`;
                
                let searchHtml = `JARVIS: He localizado registros en la red para su solicitud, señor.<br>
                <a class="model-link-btn" href="https://www.printables.com/search/models?q=${searchTerm}" target="_blank">🔍 Buscar en Printables</a>
                <a class="model-link-btn" href="https://www.thingiverse.com/search?q=${searchTerm}" target="_blank">🔍 Buscar en Thingiverse</a>`;
                
                document.getElementById('cad-code-display').innerText = codeSnippet;
                addChatMessage(searchHtml, "jarvis", true);
                speakJarvis("He localizado los enlaces de descarga para su modelo en la red, señor.");
                return;
            }

            // Geometrías predeterminadas del visor
            if (lower.includes("armadura") || lower.includes("traje") || lower.includes("mark")) {
                updateVisorModel('armor');
                codeSnippet = '// PROTOCOLO STARK\nAssembly.loadArmorMatrix();\nStatus: [OK]';
            } else if (lower.includes("esfera")) {
                updateVisorModel('sphere');
                codeSnippet = '// Geometría Esférica\nGeometry.createSphere();\nStatus: [OK]';
            } else if (lower.includes("cilindro")) {
                updateVisorModel('cylinder');
                codeSnippet = '// Geometría Cilíndrica\nGeometry.createCylinder();\nStatus: [OK]';
            } else if (lower.includes("cubo") || lower.includes("caja")) {
                updateVisorModel('box');
                codeSnippet = '// Matriz Cúbica\nGeometry.createBox();\nStatus: [OK]';
            }

            if (codeSnippet) {
                document.getElementById('cad-code-display').innerText = codeSnippet;
            }

            const aiResponse = await queryAI(text);
            addChatMessage("JARVIS: " + aiResponse, "jarvis");
            speakJarvis(aiResponse);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendPrompt();
        }

        function addChatMessage(text, sender, isHtml = false) {
            const chat = document.getElementById('jarvis-chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            if (isHtml) { div.innerHTML = text; } else { div.innerText = text; }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speakJarvis(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                // Limpiar etiquetas HTML si las hubiera para la locución de voz
                const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/["'«»\[\]]/g, '');
                const speech = new SpeechSynthesisUtterance(cleanText);
                
                speech.lang = 'es-ES';
                speech.rate = voiceRateVal;
                speech.pitch = 0.6; // Tono más grave para simular voz de asistente formal

                if (voicesList.length > 0 && voicesList[selectedVoiceIndex]) {
                    speech.voice = voicesList[selectedVoiceIndex];
                }

                window.speechSynthesis.speak(speech);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
