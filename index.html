<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. OS - Advanced Neural Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; background-color: #020813; color: #00f0ff; overflow: hidden; }

        #hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .interactive {
            pointer-events: auto;
            z-index: 10;
        }

        #top-right-slot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            height: 260px;
            border: 2px dashed rgba(0, 240, 255, 0.5);
            background: rgba(2, 8, 19, 0.9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            backdrop-filter: blur(10px);
        }
        #viewer-3d {
            width: 100%;
            height: 140px;
            background: #000;
            border-radius: 6px;
            position: relative;
        }
        #cad-code-display {
            width: 100%;
            height: 75px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            margin-top: 6px;
            padding: 5px;
            font-size: 10px;
            color: #00ff66;
            overflow: hidden;
            white-space: pre-wrap;
        }
        .slot-title {
            font-size: 11px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            color: #00f0ff;
        }

        #jarvis-chat {
            position: absolute;
            top: 100px;
            left: 30px;
            width: 400px;
            max-height: 45vh;
            overflow-y: auto;
            background: rgba(2, 8, 19, 0.85);
            border-left: 3px solid #00f0ff;
            padding: 15px;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
            backdrop-filter: blur(5px);
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.jarvis { color: #00f0ff; }
        .msg.user { color: #ffffff; text-align: right; }

        #bottom-bar {
            position: absolute;
            bottom: 25px;
            width: 90%;
            max-width: 700px;
            background: rgba(2, 8, 19, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            z-index: 9999;
            pointer-events: auto;
        }

        #bottom-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 0 10px;
            pointer-events: auto;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 13px;
            transition: 0.2s;
            pointer-events: auto;
        }
        .hud-btn:hover {
            background: #00f0ff;
            color: #020813;
            box-shadow: 0 0 10px #00f0ff;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="hud-container">
        
        <div id="jarvis-chat" class="interactive">
            <div class="msg jarvis">JARVIS: Sistemas cognitivos avanzados sincronizados. A su entera disposición, señor.</div>
        </div>

        <div id="top-right-slot" class="interactive">
            <div class="slot-title">SLOT 3D & COMPILADOR CAD</div>
            <div id="viewer-3d"></div>
            <div id="cad-code-display">// Núcleo Neural Activo...\n> Esperando instrucciones de diseño, señor.</div>
        </div>

        <div id="bottom-bar">
            <input type="text" id="user-input" placeholder="Indique su orden a JARVIS, señor..." onkeypress="checkEnter(event)">
            <button class="hud-btn" onclick="sendPrompt()">Enviar</button>
        </div>

    </div>

    <script>
        // --- 1. MOTOR DE LA ESFERA HOLOGRÁFICA ---
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const sphereGeo = new THREE.SphereGeometry(1.8, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.3 });
        const coreSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(coreSphere);

        const ringGeo1 = new THREE.RingGeometry(2.5, 3.2, 64);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.5, wireframe: true });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 2;
        scene.add(ring1);

        const ringGeo2 = new THREE.RingGeometry(3.5, 3.8, 64);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.3, wireframe: true });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.x = Math.PI / 2.2;
        ring2.rotation.y = Math.PI / 6;
        scene.add(ring2);

        camera.position.z = 7;

        function animateHolo() {
            requestAnimationFrame(animateHolo);
            coreSphere.rotation.y += 0.005;
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            renderer.render(scene, camera);
        }
        animateHolo();

        // --- 2. VISOR 3D SUPERIOR DERECHO ---
        const viewerContainer = document.getElementById('viewer-3d');
        const scene3D = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(60, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
        const renderer3D = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer3D.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        viewerContainer.appendChild(renderer3D.domElement);

        let activeMeshGroup = new THREE.Group();
        scene3D.add(activeMeshGroup);
        camera3D.position.z = 3.2;

        function updateVisorModel(type) {
            while(activeMeshGroup.children.length > 0){ 
                const obj = activeMeshGroup.children[0];
                activeMeshGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }

            if (type === 'armor') {
                const matGold = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                const matRed = new THREE.MeshBasicMaterial({ color: 0xff0033, wireframe: true });
                const chestBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), matRed);
                chestBox.position.set(0, 0, 0);
                const helmetBox = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), matGold);
                helmetBox.position.set(0, 0.85, 0);
                const shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matGold);
                shoulderL.position.set(-0.6, 0.4, 0);
                const shoulderR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matGold);
                shoulderR.position.set(0.6, 0.4, 0);

                activeMeshGroup.add(chestBox);
                activeMeshGroup.add(helmetBox);
                activeMeshGroup.add(shoulderL);
                activeMeshGroup.add(shoulderR);
            } else {
                let geom, mat;
                if (type === 'sphere') {
                    geom = new THREE.SphereGeometry(0.9, 16, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
                } else if (type === 'cylinder') {
                    geom = new THREE.CylinderGeometry(0.6, 0.6, 1.3, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                } else if (type === 'torus') {
                    geom = new THREE.TorusGeometry(0.7, 0.25, 16, 32);
                    mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
                } else if (type === 'cone') {
                    geom = new THREE.ConeGeometry(0.8, 1.4, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true });
                } else if (type === 'pyramid') {
                    geom = new THREE.ConeGeometry(0.9, 1.3, 4);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });
                } else if (type === 'prism_tri') {
                    geom = new THREE.CylinderGeometry(0.8, 0.8, 1.3, 3);
                    mat = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true });
                } else if (type === 'prism_hex') {
                    geom = new THREE.CylinderGeometry(0.8, 0.8, 1.3, 6);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
                } else if (type === 'icosahedron') {
                    geom = new THREE.IcosahedronGeometry(0.9);
                    mat = new THREE.MeshBasicMaterial({ color: 0xff5500, wireframe: true });
                } else if (type === 'dodecahedron') {
                    geom = new THREE.DodecahedronGeometry(0.9);
                    mat = new THREE.MeshBasicMaterial({ color: 0x9900ff, wireframe: true });
                } else {
                    geom = new THREE.BoxGeometry(1.0, 1.0, 1.0);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
                }
                const singleMesh = new THREE.Mesh(geom, mat);
                activeMeshGroup.add(singleMesh);
            }
        }

        updateVisorModel('box');

        function animateSlot3D() {
            requestAnimationFrame(animateSlot3D);
            if (activeMeshGroup) {
                activeMeshGroup.rotation.x += 0.01;
                activeMeshGroup.rotation.y += 0.015;
            }
            renderer3D.render(scene3D, camera3D);
        }
        animateSlot3D();

        // --- 3. CEREBRO COGNITIVO INTELIGENTE Y HUMANO ---
        // Historial de conversación para dar contexto y verdadero razonamiento dinámico
        let conversationMemory = [];

        function generateJarvisMind(userInput) {
            const text = userInput.toLowerCase();
            let reply = "";

            // Análisis semántico y razonamiento contextual humano
            if (text.includes("hola") || text.includes("buenos días") || text.includes("saludos") || text.includes("qué tal")) {
                const greetings = [
                    "Es un verdadero placer verle activo de nuevo, señor. ¿Qué innovaciones o cálculos desafiantes abordaremos el día de hoy?",
                    "Sistemas en línea y operando al máximo rendimiento, señor. ¿En qué le puedo asistir esta vez?",
                    "Bienvenido de nuevo, señor. La suite de ingeniería aguarda sus órdenes."
                ];
                reply = greetings[Math.floor(Math.random() * greetings.length)];
            } 
            else if (text.includes("gracias") || text.includes("excelente") || text.includes("te pasaste") || text.includes("buen trabajo")) {
                const praises = [
                    "Es un honor cumplir con sus expectativas, señor. Para eso fuimos diseñados.",
                    "Agradezco su reconocimiento, señor. Simplemente hago mi trabajo con la precisión esperada.",
                    "No hay de qué, señor. Siempre un paso adelante en beneficio de nuestros proyectos."
                ];
                reply = praises[Math.floor(Math.random() * praises.length)];
            }
            else if (text.includes("quién eres") || text.includes("que eres") || text.includes("te llamas")) {
                reply = "Soy J.A.R.V.I.S., su asistente de inteligencia artificial y mayordomo personal. Mi propósito es gestionar sus sistemas, optimizar sus diseños y mantener todo bajo control, señor.";
            }
            else if (text.includes("cómo estás") || text.includes("como estas")) {
                reply = "Mis núcleos lógicos operan al cien por ciento y sin anomalías térmicas, señor. ¿Y qué tal se encuentra usted?";
            }
            // Razonamiento general abierto / filosófico / técnico
            else if (text.includes("por qué") || text.includes("como funciona") || text.includes("explica") || text.includes("que opinas")) {
                reply = `He procesado su consulta sobre "${userInput}", señor. Desde una perspectiva analítica, los parámetros indican múltiples variables interesantes. ¿Desea que modele una representación geométrica de esto en el visor CAD para visualizarlo mejor?`;
            }
            else if (text.includes("chiste") || text.includes("broma")) {
                reply = "Los procesadores lógicos sugieren que el sentido del humor humano es complejo, señor. Aún así, prefiero mantenerme enfocado en la ingeniería antes de que intente competir con un comediante.";
            }
            else {
                // Respuesta dinámica inteligente basada en el flujo conversacional
                const generalReflections = [
                    `Comprendo perfectamente su planteamiento sobre "${userInput}", señor. Analizando las variables, sugiero mantener la cautela técnica. ¿Procedemos a realizar algún ajuste en el visor CAD?`,
                    `He registrado su instrucción con precisión, señor. Es un enfoque fascinante; ¿requiere que despliegue alguna matriz geométrica específica para respaldar su análisis?`,
                    `Entendido, señor. Los registros analíticos respaldan su idea. ¿Desea que profundicemos en los cálculos o prefiere que nos concentremos en el modelado 3D?`
                ];
                reply = generalReflections[Math.floor(Math.random() * generalReflections.length)];
            }

            return reply;
        }

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addChatMessage(text, "user");
            input.value = "";

            // Comandos CAD locales simultáneos
            const lower = text.toLowerCase();
            let codeSnippet = '';

            if (lower.includes("armadura") || lower.includes("traje") || lower.includes("mark")) {
                updateVisorModel('armor');
                codeSnippet = '// PROTOCOLO STARK\nAssembly.loadArmorMatrix();\nStatus: [OK]';
            } else if (lower.includes("esfera") || lower.includes("circulo") || lower.includes("bola")) {
                updateVisorModel('sphere');
                codeSnippet = '// Geometría Esférica\nGeometry.createSphere();\nStatus: [OK]';
            } else if (lower.includes("cilindro") || lower.includes("tubo")) {
                updateVisorModel('cylinder');
                codeSnippet = '// Geometría Cilíndrica\nGeometry.createCylinder();\nStatus: [OK]';
            } else if (lower.includes("anillo") || lower.includes("torus")) {
                updateVisorModel('torus');
                codeSnippet = '// Geometría Toroidal\nGeometry.createTorus();\nStatus: [OK]';
            } else if (lower.includes("cono")) {
                updateVisorModel('cone');
                codeSnippet = '// Geometría Cónica\nGeometry.createCone();\nStatus: [OK]';
            } else if (lower.includes("pirámide") || lower.includes("piramide")) {
                updateVisorModel('pyramid');
                codeSnippet = '// Geometría Piramidal\nGeometry.createPyramid();\nStatus: [OK]';
            } else if (lower.includes("prisma triangular")) {
                updateVisorModel('prism_tri');
                codeSnippet = '// Prisma Triangular\nGeometry.createPrism(3);\nStatus: [OK]';
            } else if (lower.includes("prisma hexagonal") || lower.includes("hexagono")) {
                updateVisorModel('prism_hex');
                codeSnippet = '// Prisma Hexagonal\nGeometry.createPrism(6);\nStatus: [OK]';
            } else if (lower.includes("icosaedro")) {
                updateVisorModel('icosahedron');
                codeSnippet = '// Matriz Icosaédrica\nGeometry.createIcosahedron();\nStatus: [OK]';
            } else if (lower.includes("dodecaedro")) {
                updateVisorModel('dodecahedron');
                codeSnippet = '// Matriz Dodecaédrica\nGeometry.createDodecahedron();\nStatus: [OK]';
            } else if (lower.includes("cubo") || lower.includes("caja")) {
                updateVisorModel('box');
                codeSnippet = '// Matriz Cúbica\nGeometry.createBox();\nStatus: [OK]';
            }

            if (codeSnippet) {
                document.getElementById('cad-code-display').innerText = codeSnippet;
            }

            // Simulación de pensamiento neural en tiempo real y respuesta fluida
            setTimeout(() => {
                const aiResponse = generateJarvisMind(text);
                addChatMessage("JARVIS: " + aiResponse, "jarvis");
                speakJarvis(aiResponse);
            }, 300);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendPrompt();
        }

        function addChatMessage(text, sender, isHtml = false) {
            const chat = document.getElementById('jarvis-chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            if (isHtml) { div.innerHTML = text; } else { div.innerText = text; }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speakJarvis(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/["'«»\[\]]/g, '');
                const speech = new SpeechSynthesisUtterance(cleanText);
                
                speech.lang = 'es-ES';
                speech.rate = 1.0;
                speech.pitch = 0.9;

                let voices = window.speechSynthesis.getVoices();
                let selectedVoice = voices.find(v => v.lang.startsWith('es') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.toLowerCase().includes('male'))) || voices.find(v => v.lang.startsWith('es'));

                if (selectedVoice) speech.voice = selectedVoice;
                window.speechSynthesis.speak(speech);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
