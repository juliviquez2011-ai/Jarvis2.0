<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. OS - Groq Neural Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; background-color: #020813; color: #00f0ff; overflow: hidden; }

        #hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .interactive {
            pointer-events: auto;
            z-index: 10;
        }

        #api-config-panel {
            position: absolute;
            top: 20px;
            left: 30px;
            background: rgba(2, 8, 19, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        #api-config-panel input {
            background: #000;
            border: 1px solid #00f0ff;
            color: #00ff66;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            width: 150px;
            outline: none;
        }

        /* Botón de configuración movido a la esquina inferior derecha */
        #settings-toggle-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10000;
        }

        /* Menú de Configuración Expandido (esquina inferior derecha) */
        #settings-modal {
            position: absolute;
            bottom: 80px;
            right: 25px;
            width: 320px;
            background: rgba(2, 8, 19, 0.95);
            border: 1px solid #00f0ff;
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            z-index: 20000;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        #settings-modal h3 {
            font-size: 13px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 5px;
            letter-spacing: 1px;
            color: #00ffcc;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
        }
        .setting-group label {
            color: #00f0ff;
        }
        .setting-group select {
            background: #000;
            border: 1px solid #00f0ff;
            color: #00ff66;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            outline: none;
        }

        #top-right-slot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            height: 260px;
            border: 2px dashed rgba(0, 240, 255, 0.5);
            background: rgba(2, 8, 19, 0.9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            backdrop-filter: blur(10px);
        }
        #viewer-3d {
            width: 100%;
            height: 140px;
            background: #000;
            border-radius: 6px;
            position: relative;
        }
        #cad-code-display {
            width: 100%;
            height: 75px;
            background: rgba(0, 10, 25, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            margin-top: 6px;
            padding: 5px;
            font-size: 10px;
            color: #00ff66;
            overflow: hidden;
            white-space: pre-wrap;
        }
        .slot-title {
            font-size: 11px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            color: #00f0ff;
        }

        #jarvis-chat {
            position: absolute;
            top: 140px;
            left: 30px;
            width: 400px;
            max-height: 45vh;
            overflow-y: auto;
            background: rgba(2, 8, 19, 0.85);
            border-left: 3px solid #00f0ff;
            padding: 15px;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
            backdrop-filter: blur(5px);
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.jarvis { color: #00f0ff; }
        .msg.user { color: #ffffff; text-align: right; }

        #bottom-bar {
            position: absolute;
            bottom: 25px;
            width: calc(90% - 70px);
            max-width: 620px;
            left: 30px;
            background: rgba(2, 8, 19, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            z-index: 9999;
            pointer-events: auto;
        }

        #bottom-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 0 10px;
            pointer-events: auto;
        }

        .hud-btn {
            background: transparent;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 13px;
            transition: 0.2s;
            pointer-events: auto;
        }
        .hud-btn:hover {
            background: #00f0ff;
            color: #020813;
            box-shadow: 0 0 10px #00f0ff;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="hud-container">
        
        <div id="api-config-panel" class="interactive">
            <span>Groq Key:</span>
            <input type="password" id="groq-key-input" placeholder="gsk_..." onchange="saveGroqKey()">
            <button class="hud-btn" style="padding: 2px 8px; font-size: 10px;" onclick="saveGroqKey()">Guardar</button>
        </div>

        <button id="settings-toggle-btn" class="hud-btn interactive" style="padding: 8px 12px; font-size: 13px;" onclick="toggleSettingsMenu()">⚙️ Config</button>

        <!-- Menú de Configuración Extendido -->
        <div id="settings-modal" class="interactive">
            <h3>PANEL DE CONFIGURACIÓN J.A.R.V.I.S.</h3>
            
            <div class="setting-group">
                <label>Forma de Trato:</label>
                <select id="address-mode-select" onchange="updateAddressMode(this.value)">
                    <option value="bro">Llamarme "bro"</option>
                    <option value="senor">Llamarme "señor"</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Voz del Sistema (Español):</label>
                <select id="voice-select" onchange="updateSelectedVoice(this.value)">
                    <option value="">Cargando voces...</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Velocidad de Voz:</label>
                <select id="voice-rate-select" onchange="updateVoiceRate(this.value)">
                    <option value="0.9">Normal (0.9x)</option>
                    <option value="1.0">Rápida (1.0x)</option>
                    <option value="0.8">Lenta (0.8x)</option>
                </select>
            </div>

            <div style="display: flex; gap: 6px; margin-top: 5px;">
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px;" onclick="clearChatHistory()">Limpiar Chat</button>
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px; border-color: #00ff88; color: #00ff88;" onclick="restartSystem()">🔄 Reiniciar</button>
            </div>

            <button class="hud-btn" style="margin-left: 0; margin-top: 2px; text-align: center; font-size: 11px;" onclick="toggleSettingsMenu()">Cerrar Panel</button>
        </div>

        <div id="jarvis-chat" class="interactive">
            <div class="msg jarvis" id="welcome-msg">JARVIS: Núcleo neural activo, bro.</div>
        </div>

        <div id="top-right-slot" class="interactive">
            <div class="slot-title">SLOT 3D & COMPILADOR CAD</div>
            <div id="viewer-3d"></div>
            <div id="cad-code-display">// Núcleo Neural Activo...\n> A la espera de sus instrucciones, bro.</div>
        </div>

        <div id="bottom-bar">
            <input type="text" id="user-input" placeholder="Indique su orden a JARVIS, bro..." onkeypress="checkEnter(event)">
            <button class="hud-btn" onclick="sendPrompt()">Enviar</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const sphereGeo = new THREE.SphereGeometry(1.8, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.3 });
        const coreSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(coreSphere);

        const ringGeo1 = new THREE.RingGeometry(2.3, 2.7, 64);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.6, wireframe: true });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 2;
        scene.add(ring1);

        const ringGeo2 = new THREE.RingGeometry(3.0, 3.4, 64);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.4, wireframe: true });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.x = Math.PI / 2.2;
        ring2.rotation.y = Math.PI / 6;
        scene.add(ring2);

        const ringGeo3 = new THREE.RingGeometry(3.8, 4.1, 64);
        const ringMat3 = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.3, wireframe: true });
        const ring3 = new THREE.Mesh(ringGeo3, ringMat3);
        ring3.rotation.x = Math.PI / 1.5;
        ring3.rotation.z = Math.PI / 4;
        scene.add(ring3);

        camera.position.z = 7;

        let clock = new THREE.Clock();
        function animateHolo() {
            requestAnimationFrame(animateHolo);
            let elapsedTime = clock.getElapsedTime();

            coreSphere.rotation.y += 0.005;
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            ring3.rotation.x += 0.005;
            ring3.rotation.y -= 0.007;

            let dynamicHue = (elapsedTime * 0.05) % 1;
            ringMat1.color.setHSL(dynamicHue, 1.0, 0.5);
            ringMat2.color.setHSL((dynamicHue + 0.3) % 1, 1.0, 0.5);
            ringMat3.color.setHSL((dynamicHue + 0.6) % 1, 1.0, 0.5);

            renderer.render(scene, camera);
        }
        animateHolo();

        const viewerContainer = document.getElementById('viewer-3d');
        const scene3D = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(60, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
        const renderer3D = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer3D.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        viewerContainer.appendChild(renderer3D.domElement);

        let activeMeshGroup = new THREE.Group();
        scene3D.add(activeMeshGroup);
        camera3D.position.z = 3.2;

        function updateVisorModel(type) {
            while(activeMeshGroup.children.length > 0){ 
                const obj = activeMeshGroup.children[0];
                activeMeshGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }

            if (type === 'armor') {
                const matGold = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                const matRed = new THREE.MeshBasicMaterial({ color: 0xff0033, wireframe: true });
                const chestBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), matRed);
                chestBox.position.set(0, 0, 0);
                const helmetBox = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), matGold);
                helmetBox.position.set(0, 0.85, 0);
                const shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matGold);
                shoulderL.position.set(-0.6, 0.4, 0);
                const shoulderR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matGold);
                shoulderR.position.set(0.6, 0.4, 0);

                activeMeshGroup.add(chestBox);
                activeMeshGroup.add(helmetBox);
                activeMeshGroup.add(shoulderL);
                activeMeshGroup.add(shoulderR);
            } else {
                let geom, mat;
                if (type === 'sphere') {
                    geom = new THREE.SphereGeometry(0.9, 16, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
                } else if (type === 'cylinder') {
                    geom = new THREE.CylinderGeometry(0.6, 0.6, 1.3, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true });
                } else if (type === 'torus') {
                    geom = new THREE.TorusGeometry(0.7, 0.25, 16, 32);
                    mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
                } else if (type === 'cone') {
                    geom = new THREE.ConeGeometry(0.8, 1.4, 16);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true });
                } else if (type === 'pyramid') {
                    geom = new THREE.ConeGeometry(0.9, 1.3, 4);
                    mat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });
                } else {
                    geom = new THREE.BoxGeometry(1.0, 1.0, 1.0);
                    mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
                }
                const singleMesh = new THREE.Mesh(geom, mat);
                activeMeshGroup.add(singleMesh);
            }
        }

        updateVisorModel('box');

        function animateSlot3D() {
            requestAnimationFrame(animateSlot3D);
            if (activeMeshGroup) {
                activeMeshGroup.rotation.x += 0.01;
                activeMeshGroup.rotation.y += 0.015;
            }
            renderer3D.render(scene3D, camera3D);
        }
        animateSlot3D();

        let currentMode = 'bro';
        let selectedVoiceIndex = 0;
        let voiceRateVal = 0.9;
        let voicesList = [];

        function getSystemPrompt() {
            if (currentMode === 'bro') {
                return "Eres J.A.R.V.I.S., el asistente de IA. Te diriges al usuario estrictamente, en cada respuesta y sin excepciones, como 'bro'. Eres amigable, moderno, leal y directo.";
            } else {
                return "Eres J.A.R.V.I.S., el mayordomo virtual y asistente de inteligencia artificial de Tony Stark. Te diriges al usuario estrictamente, en cada respuesta y sin excepciones, como 'señor'. Eres educado, sumamente inteligente, leal, sofisticado y formal.";
            }
        }

        let chatHistory = [
            { role: "system", content: getSystemPrompt() }
        ];

        function toggleSettingsMenu() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function updateAddressMode(mode) {
            currentMode = mode;
            chatHistory[0].content = getSystemPrompt();
            
            let term = (mode === 'bro') ? 'bro' : 'señor';
            document.getElementById('welcome-msg').innerText = `JARVIS: Modo de trato actualizado a "${term}".`;
            document.getElementById('user-input').placeholder = `Indique su orden a JARVIS, ${term}...`;
            document.getElementById('cad-code-display').innerText = `// Protocolo de trato cambiado\n> Tratando al usuario como: ${term}.`;
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            // Filtramos voces en español
            voicesList = window.speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().includes('es'));
            const select = document.getElementById('voice-select');
            select.innerHTML = '';
            
            if (voicesList.length === 0) {
                let opt = document.createElement('option');
                opt.text = "No hay voces en español detectadas";
                select.appendChild(opt);
                return;
            }

            voicesList.forEach((voice, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                // Intentamos identificar si el nombre sugiere voz masculina o de otro tipo para guiarte
                let tag = voice.name.toLowerCase();
                let genderHint = (tag.includes('pablo') || tag.includes('raul') || tag.includes('alvaro') || tag.includes('jorge') || tag.includes('male') || tag.includes('david') || tag.includes('carlos')) ? ' [Hombre]' : '';
                opt.text = `${voice.name} (${voice.lang})${genderHint}`;
                select.appendChild(opt);
            });
        }

        function updateSelectedVoice(index) {
            selectedVoiceIndex = parseInt(index);
        }

        function updateVoiceRate(val) {
            voiceRateVal = parseFloat(val);
        }

        function clearChatHistory() {
            const chat = document.getElementById('jarvis-chat');
            chat.innerHTML = `<div class="msg jarvis" id="welcome-msg">JARVIS: Memoria de chat depurada, bro.</div>`;
            chatHistory = [{ role: "system", content: getSystemPrompt() }];
        }

        function restartSystem() {
            location.reload();
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            setTimeout(loadVoices, 300);
        }

        function saveGroqKey() {
            const key = document.getElementById('groq-key-input').value.trim();
            if (key) {
                localStorage.setItem('groq_api_key', key);
                let term = (currentMode === 'bro') ? 'bro' : 'señor';
                addChatMessage(`JARVIS: Llave de Groq guardada correctamente en memoria, ${term}.`, "jarvis");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('groq_api_key');
            if (savedKey) {
                document.getElementById('groq-key-input').value = savedKey;
            }
        });

        async function queryGroqAI(userText) {
            const apiKey = localStorage.getItem('groq_api_key') || document.getElementById('groq-key-input').value.trim();
            let term = (currentMode === 'bro') ? 'bro' : 'señor';
            
            if (!apiKey) {
                return `Por favor, introduzca su API Key de Groq en el panel superior izquierdo para activar mis funciones cognitivas, ${term}.`;
            }

            chatHistory[0].content = getSystemPrompt();
            chatHistory.push({ role: "user", content: userText });

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: chatHistory,
                        max_tokens: 300,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    chatHistory.push({ role: "assistant", content: reply });
                    return reply;
                } else if (data.error) {
                    return `Error de Groq: ${data.error.message}`;
                } else {
                    return `Recepción de datos fallida con el clúster de Groq, ${term}.`;
                }
            } catch (err) {
                return `Error de red al conectar con los servidores de Groq, ${term}.`;
            }
        }

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addChatMessage(text, "user");
            input.value = "";

            const lower = text.toLowerCase();
            let codeSnippet = '';

            if (lower.includes("armadura") || lower.includes("traje") || lower.includes("mark")) {
                updateVisorModel('armor');
                codeSnippet = '// PROTOCOLO STARK\nAssembly.loadArmorMatrix();\nStatus: [OK]';
            } else if (lower.includes("esfera") || lower.includes("circulo") || lower.includes("circulito") || lower.includes("bola")) {
                updateVisorModel('sphere');
                codeSnippet = '// Geometría Esférica\nGeometry.createSphere();\nStatus: [OK]';
            } else if (lower.includes("cilindro") || lower.includes("tubo")) {
                updateVisorModel('cylinder');
                codeSnippet = '// Geometría Cilíndrica\nGeometry.createCylinder();\nStatus: [OK]';
            } else if (lower.includes("anillo") || lower.includes("torus")) {
                updateVisorModel('torus');
                codeSnippet = '// Geometría Toroidal\nGeometry.createTorus();\nStatus: [OK]';
            } else if (lower.includes("cono")) {
                updateVisorModel('cone');
                codeSnippet = '// Geometría Cónica\nGeometry.createCone();\nStatus: [OK]';
            } else if (lower.includes("pirámide") || lower.includes("piramide")) {
                updateVisorModel('pyramid');
                codeSnippet = '// Geometría Piramidal\nGeometry.createPyramid();\nStatus: [OK]';
            } else if (lower.includes("cubo") || lower.includes("caja") || lower.includes("cuadrado")) {
                updateVisorModel('box');
                codeSnippet = '// Matriz Cúbica\nGeometry.createBox();\nStatus: [OK]';
            }

            if (codeSnippet) {
                document.getElementById('cad-code-display').innerText = codeSnippet;
            }

            const aiResponse = await queryGroqAI(text);
            addChatMessage("JARVIS: " + aiResponse, "jarvis");
            speakJarvis(aiResponse);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendPrompt();
        }

        function addChatMessage(text, sender, isHtml = false) {
            const chat = document.getElementById('jarvis-chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            if (isHtml) { div.innerHTML = text; } else { div.innerText = text; }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speakJarvis(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/["'«»\[\]]/g, '');
                const speech = new SpeechSynthesisUtterance(cleanText);
                
                speech.lang = 'es-ES';
                speech.rate = voiceRateVal;
                speech.pitch = (currentMode === 'bro') ? 0.9 : 0.7;

                if (voicesList.length > 0 && voicesList[selectedVoiceIndex]) {
                    speech.voice = voicesList[selectedVoiceIndex];
                }

                window.speechSynthesis.speak(speech);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
